<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Memory shortly after launch: Phi, Pi, Claude Code and Codex</title>
<desc id="desc">Total proportional set size, median of three normal-profile launches. Measured after eight seconds, with no prompts submitted. Linear scale, zero baseline; whiskers show trial minimum and maximum.</desc>
<rect width="1000" height="430" rx="16" fill="#101714"/>
<g font-family="system-ui,sans-serif" fill="#e4eee8">
<text x="32" y="40" font-size="25" font-weight="650">Memory shortly after launch</text>
<text x="32" y="66" font-size="14" fill="#a2b5aa">Total PSS · normal profiles · 3 launches · median and min–max · lower is better</text>
<line x1="180.0" x2="180.0" y1="95" y2="322" stroke="#2a3931"/>
<text x="180.0" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">0</text>
<line x1="288.3333333333333" x2="288.3333333333333" y1="95" y2="322" stroke="#2a3931"/>
<text x="288.3333333333333" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">200</text>
<line x1="396.66666666666663" x2="396.66666666666663" y1="95" y2="322" stroke="#2a3931"/>
<text x="396.66666666666663" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">400</text>
<line x1="505.0" x2="505.0" y1="95" y2="322" stroke="#2a3931"/>
<text x="505.0" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">600</text>
<line x1="613.3333333333333" x2="613.3333333333333" y1="95" y2="322" stroke="#2a3931"/>
<text x="613.3333333333333" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">800</text>
<line x1="721.6666666666666" x2="721.6666666666666" y1="95" y2="322" stroke="#2a3931"/>
<text x="721.6666666666666" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">1000</text>
<line x1="830.0" x2="830.0" y1="95" y2="322" stroke="#2a3931"/>
<text x="830.0" y="345" text-anchor="middle" font-size="12" fill="#a2b5aa">1200</text>
<text x="32" y="129" font-size="17">Phi</text>
<rect x="180" y="105" width="3.564" height="34" rx="2" fill="#91d5a4"/>
<path d="M 183.516 122 H 183.578 M 183.516 116 V 128 M 183.578 116 V 128" stroke="#ffffff" stroke-width="1.5" fill="none"/>
<text x="197.564" y="129" font-size="17" font-weight="600">6.58 MiB</text>
<text x="32" y="184" font-size="17">Pi</text>
<rect x="180" y="160" width="59.449" height="34" rx="2" fill="#88b6d5"/>
<path d="M 239.062 177 H 239.730 M 239.062 171 V 183 M 239.730 171 V 183" stroke="#ffffff" stroke-width="1.5" fill="none"/>
<text x="253.449" y="184" font-size="17" font-weight="600">109.75 MiB</text>
<text x="32" y="239" font-size="17">Claude Code</text>
<rect x="180" y="215" width="131.254" height="34" rx="2" fill="#d9a582"/>
<path d="M 310.735 232 H 312.158 M 310.735 226 V 238 M 312.158 226 V 238" stroke="#ffffff" stroke-width="1.5" fill="none"/>
<text x="325.254" y="239" font-size="17" font-weight="600">242.31 MiB</text>
<text x="32" y="294" font-size="17">Codex</text>
<rect x="180" y="270" width="593.902" height="34" rx="2" fill="#b6aad7"/>
<path d="M 742.197 287 H 775.031 M 742.197 281 V 293 M 775.031 281 V 293" stroke="#ffffff" stroke-width="1.5" fill="none"/>
<text x="787.902" y="294" font-size="17" font-weight="600">1,096.43 MiB</text>
<text x="505" y="368" text-anchor="middle" font-size="13" fill="#a2b5aa">Total proportional set size (MiB), linear scale</text>
<text x="32" y="397" font-size="12" fill="#a2b5aa">Arch Linux · Intel i5-8365U · 100×30 PTY · sampled from 8 seconds after launch · no model tasks</text>
<text x="32" y="416" font-size="12" fill="#a2b5aa">Includes trial processes and detached hosts; excludes terminal emulator. Settings differ; not a universal ranking.</text>
</g></svg>
