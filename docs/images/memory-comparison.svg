<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Phi vs Pi, Claude Code and Codex</title>
<desc id="desc">Install size: Phi 1.4 MiB, Pi 304, Claude Code 316, Codex 516. RAM at idle: Phi 6.3 MiB, Pi 108, Claude Code 213, Codex about 450. Startup: Phi 33 ms, Pi 360, Claude Code 528, Codex 1205. Lower is better.</desc>
<rect width="1000" height="360" rx="16" fill="#101714"/>
<g font-family="system-ui,sans-serif" fill="#e4eee8">
<text x="32" y="44" font-size="24" font-weight="650">Phi vs other coding agents</text>
<text x="32" y="70" font-size="14" fill="#a2b5aa">Lower is better</text>
<text x="32" y="141" font-size="16" font-weight="650">Phi</text>
<text x="32" y="191" font-size="16">Pi</text>
<text x="32" y="241" font-size="16">Claude Code</text>
<text x="32" y="291" font-size="16">Codex</text>
<text x="160" y="104" font-size="14" font-weight="600" fill="#a2b5aa">Install size</text>
<rect x="160" y="120" width="2.5" height="30" rx="3" fill="#91d5a4"/>
<text x="170.5" y="141" font-size="14" font-weight="700">1.4 MiB</text>
<rect x="160" y="170" width="100.2" height="30" rx="3" fill="#88b6d5"/>
<text x="268.2" y="191" font-size="14">304 MiB</text>
<rect x="160" y="220" width="104.1" height="30" rx="3" fill="#d9a582"/>
<text x="272.1" y="241" font-size="14">316 MiB</text>
<rect x="160" y="270" width="170.0" height="30" rx="3" fill="#b6aad7"/>
<text x="338.0" y="291" font-size="14">516 MiB</text>
<text x="440" y="104" font-size="14" font-weight="600" fill="#a2b5aa">RAM at idle</text>
<rect x="440" y="120" width="2.5" height="30" rx="3" fill="#91d5a4"/>
<text x="450.5" y="141" font-size="14" font-weight="700">6.3 MiB</text>
<rect x="440" y="170" width="40.8" height="30" rx="3" fill="#88b6d5"/>
<text x="488.8" y="191" font-size="14">108 MiB</text>
<rect x="440" y="220" width="80.5" height="30" rx="3" fill="#d9a582"/>
<text x="528.5" y="241" font-size="14">213 MiB</text>
<rect x="440" y="270" width="170.0" height="30" rx="3" fill="#b6aad7"/>
<text x="618.0" y="291" font-size="14">~450 MiB</text>
<text x="720" y="104" font-size="14" font-weight="600" fill="#a2b5aa">Startup time</text>
<rect x="720" y="120" width="4.7" height="30" rx="3" fill="#91d5a4"/>
<text x="732.7" y="141" font-size="14" font-weight="700">33 ms</text>
<rect x="720" y="170" width="50.8" height="30" rx="3" fill="#88b6d5"/>
<text x="778.8" y="191" font-size="14">360 ms</text>
<rect x="720" y="220" width="74.5" height="30" rx="3" fill="#d9a582"/>
<text x="802.5" y="241" font-size="14">528 ms</text>
<rect x="720" y="270" width="170.0" height="30" rx="3" fill="#b6aad7"/>
<text x="898.0" y="291" font-size="14">1.2 s</text>
<text x="32" y="332" font-size="13" fill="#a2b5aa">Phi: no runtime, no bundled packages · Pi: Node.js + 117 npm packages · Claude Code: Bun · Codex: 413+ Rust crates</text>
</g></svg>
